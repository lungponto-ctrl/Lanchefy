<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Super Admin | Lanchefy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', system-ui, sans-serif; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .form-control { background-color: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; }
        .form-control:focus { background-color: #0f172a; border-color: #ff5722; color: white; box-shadow: 0 0 0 3px rgba(255,87,34,0.2); }
        .btn-custom { background-color: #ff5722; border: none; color: white; font-weight: 700; padding: 12px; border-radius: 10px; width: 100%; }
        .btn-custom:hover { background-color: #f4511e; color: white; }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white mb-1"><i class="fa-solid fa-shield-halved text-warning me-2"></i>Super Admin</h3>
            <p class="text-muted small mb-0">Painel de Gestão Global Lanchefy</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger border-0 small py-2 text-center rounded-3 mb-3" role="alert">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase text-secondary">Usuário</label>
                <input type="text" class="form-control" name="usuario" placeholder="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase text-secondary">Senha de Segurança</label>
                <input type="password" class="form-control" name="senha" placeholder="••••••••" required>
                <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Exige maiúsculas, minúsculas, números e caracteres especiais.</small>
            </div>
            <button type="submit" class="btn btn-custom shadow-sm">Entrar no Painel</button>
        </form>
    </div>
</body>
</html>
