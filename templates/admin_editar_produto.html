<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto - {{ est.nome }} | Lanchefy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: {{ est.cor_primaria }}; }
        body { background-color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
        .card-custom { border: 1px solid #e2e8f0; border-radius: 16px; background: white; }
        .btn-primary-custom { background-color: var(--primary-color); border: none; color: white; font-weight: 600; padding: 12px; border-radius: 10px; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 500px;">
        <div class="card card-custom p-4 shadow-sm">
            <h4 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Editar Produto</h4>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-secondary">Nome do Produto</label>
                    <input type="text" class="form-control rounded-3 p-2" name="nome" value="{{ produto.nome }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-secondary">Descrição</label>
                    <textarea class="form-control rounded-3 p-2" name="descricao" rows="2">{{ produto.descricao }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-secondary">Preço (R$)</label>
                    <input type="number" step="0.01" class="form-control rounded-3 p-2" name="preco" value="{{ produto.preco }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-secondary">Categoria</label>
                    <input type="text" class="form-control rounded-3 p-2" name="categoria" value="{{ produto.categoria }}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-uppercase text-secondary">Alterar Foto (Opcional)</label>
                    <input type="file" class="form-control rounded-3 p-2" name="foto" accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 shadow-sm mb-2">Salvar Alterações</button>
                <a href="/admin/{{ est.slug }}/produtos" class="btn btn-outline-secondary w-100 py-2 rounded-3 text-decoration-none">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
