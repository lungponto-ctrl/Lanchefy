<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code do Cardápio - {{ est.nome }} | Lanchefy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --primary-color: {{ est.cor_primaria }}; }
        body { background-color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; color: #1e293b; }
        .navbar-admin { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .brand-badge { background-color: var(--primary-color); color: white; padding: 6px 14px; border-radius: 10px; font-weight: 600; }
        .card-qrcode { border: 1px solid #e2e8f0; border-radius: 20px; background: white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 450px; margin: 0 auto; text-align: center; padding: 40px; }
        #qrcode img { margin: 0 auto; border-radius: 10px; }
        @media print {
            body { background: white; }
            .navbar-admin, .btn-print { display: none !important; }
            .card-qrcode { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-admin shadow-sm py-3 mb-4">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <span class="brand-badge"><i class="fa-solid fa-store me-2"></i>{{ est.nome }}</span>
                <span class="text-muted fw-semibold">| QR Code para Mesas</span>
            </div>
            <div>
                <a href="/admin/{{ est.slug }}/produtos" class="btn btn-outline-dark btn-sm fw-bold">
                    <i class="fa-solid fa-arrow-left me-1"></i> Voltar aos Produtos
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-4 text-center">
        <div class="card card-qrcode">
            <h3 class="fw-bold text-dark mb-1">{{ est.nome }}</h3>
            <p class="text-muted small mb-4">Aponte a câmera do celular para ver o cardápio e fazer o seu pedido!</p>

            <div id="qrcode" class="mb-4 p-3 bg-light rounded-4 d-inline-block border"></div>

            <p class="small text-muted text-break mb-4"><i class="fa-solid fa-link me-1"></i>{{ url_cardapio }}</p>

            <button type="button" class="btn btn-dark w-100 py-3 fw-bold rounded-3 shadow-sm btn-print" onclick="window.print()">
                <i class="fa-solid fa-print me-2"></i> Imprimir QR Code para as Mesas 🖨️
            </button>
        </div>
    </div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ url_cardapio }}",
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
